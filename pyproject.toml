[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumiki-blender"
version = "0.1.0"
description = "Reusable Blender Python toolkit for cinematic procedural 3D authoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yuki Umetsu"}]
dependencies = []

[project.optional-dependencies]
composer = ["pydantic>=2.10,<3"]
qa = ["Pillow>=11,<13", "numpy>=1.26,<3"]
character-qa = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "opencv-python-headless>=4.10,<5", "scikit-image>=0.24,<1"]
character-build = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-image>=0.24,<1"]
character-qa-advanced = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "opencv-python-headless>=4.10,<5", "scikit-image>=0.24,<1"]
# Local-checkpoint model adapters: this extra installs no model weights and requires no HF approval.
character-qa-models = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "opencv-python-headless>=4.10,<5", "torch>=2.5.1,<3", "torchvision>=0.20.1,<1"]
finishing = ["Pillow>=11,<13", "numpy>=1.26,<3"]
photogrammetry = ["Pillow>=11,<13", "numpy>=1.26,<3", "pycolmap>=4.0.2,<5"]
masks = ["Pillow>=11,<13", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
mask-ai = ["Pillow>=11,<13", "numpy>=1.26,<3", "rembg[cpu]>=2.0.67,<3"]
mask-sam2 = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "torch>=2.5.1,<3", "torchvision>=0.20.1,<1"]
mask-grounding = ["Pillow>=11,<13", "numpy>=1.26,<3", "scipy>=1.13,<2", "torch>=2.5.1,<3", "torchvision>=0.20.1,<1", "transformers>=4.50,<6", "huggingface-hub>=0.25,<2", "safetensors>=0.4,<1"]
# Feed-forward camera poses (Mac MPS/CPU or CUDA). Pinned to the tested MapAnything commit;
# first run also downloads DINOv2 encoder weights through torch hub.
mapanything = ["Pillow>=11,<13", "numpy>=1.26,<3", "torch>=2.5.1,<3", "torchvision>=0.20.1,<1", "mapanything @ git+https://github.com/facebookresearch/map-anything.git@3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9"]

[project.scripts]
kumiki-blender = "kumiki_blender.cli:main"
kumiki-character-qa = "kumiki_blender.character_fidelity.__main__:main"
kumiki-character-build = "kumiki_blender.character_build.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumiki_blender = ["assets/*/*/*/asset.json"]
