[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kumiki-blender"
version = "0.1.0"
description = "Reusable Blender Python toolkit for cinematic procedural 3D authoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Yuki Umetsu"}]
dependencies = []

[project.optional-dependencies]
composer = ["pydantic>=2.10,<3"]
qa = ["Pillow>=11,<13"]
reconstruction = ["numpy>=1.26", "scipy>=1.11"]
preview = ["numpy>=1.26", "trimesh>=4.5"]
head-qa = ["numpy>=1.26", "trimesh>=4.5", "vtk>=9.2", "Pillow>=11,<13"]

[project.scripts]
kumiki-blender = "kumiki_blender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumiki_blender = ["assets/*/*/*/asset.json"]
