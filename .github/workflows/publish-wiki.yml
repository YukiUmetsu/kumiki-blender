name: Publish GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish Markdown pages to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # GitHub creates the wiki Git repository only after its first page
          # has been saved via the Wiki tab. This is separate from has_wiki.
          wiki_directory="$(mktemp -d)"
          authorization="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          wiki_remote="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git -c "http.extraheader=$authorization" clone --quiet "$wiki_remote" "$wiki_directory"; then
            echo "::error::Could not clone the GitHub Wiki. Enable Wikis, create its first Home page in the Wiki tab, and rerun this workflow. Also check GITHUB_TOKEN contents:write access."
            exit 1
          fi

          # Update only the pages maintained in source control. Never delete
          # other wiki pages, and never force-push to rewrite wiki history.
          cp wiki/*.md "$wiki_directory/"
          git -C "$wiki_directory" add -- '*.md'

          if git -C "$wiki_directory" diff --cached --quiet; then
            echo "GitHub Wiki is already in sync."
            exit 0
          fi

          git -C "$wiki_directory" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "docs: sync beginner wiki from main"

          git -C "$wiki_directory" -c "http.extraheader=$authorization" push --quiet origin HEAD
          echo "Published wiki pages from the wiki/ directory."
