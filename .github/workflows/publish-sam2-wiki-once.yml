name: Publish SAM 2 Wiki (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-sam2-wiki-once.yml"
      - ".github/wiki-patches/sam2.patch"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed wiki patch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply reviewed patch to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          wiki_dir="$(mktemp -d)"
          authorization="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          git -c "http.extraheader=$authorization" clone --quiet "$remote" "$wiki_dir"
          git -C "$wiki_dir" apply --check "$GITHUB_WORKSPACE/.github/wiki-patches/sam2.patch"
          git -C "$wiki_dir" apply "$GITHUB_WORKSPACE/.github/wiki-patches/sam2.patch"
          git -C "$wiki_dir" add -- "*.md"
          if git -C "$wiki_dir" diff --cached --quiet; then
            echo "No wiki changes to publish."
            exit 0
          fi
          git -C "$wiki_dir" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: explain SAM 2 foreground segmentation"
          git -C "$wiki_dir" -c "http.extraheader=$authorization" push --quiet origin HEAD:master
          echo "Published SAM 2 wiki pages."
