name: Python foundation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src scripts

  blender-smoke:
    name: Headless Blender 4.5 render and GLB QA
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libegl1 libgl1
      - name: Cache official Blender archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64
      - name: Download and verify Blender 4.5.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz" \
              --output "$archive"
          fi
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" \
            --output "$RUNNER_TEMP/blender-4.5.15.sha256"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          grep -q "$checksum.*blender-4.5.15-linux-x64.tar.xz" "$RUNNER_TEMP/blender-4.5.15.sha256"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Inspect Blender runtime
        run: blender --version
      - name: Isolate stock Blender glTF exporter on one cube
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_gltf_probe.py
      - name: Render modular portico in reduced-cost QA mode
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-portico --bays 3 --output .review/ci/portico
      - name: Render Doric-style carved column variant
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-portico --bays 2 --order doric --output .review/ci/doric-portico
      - name: Render reusable architectural facade detail kit
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-facade --bays 3 --output .review/ci/facade
      - name: Render lattice tower in reduced-cost QA mode
        if: always()
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build --recipe examples/lattice-observation-tower.json \
            --output .review/ci/lattice-tower
      - name: Set up Node for independent glTF specification validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned glTF-Transform validation CLI
        run: npm install --global @gltf-transform/cli@4.5.1
      - name: Round-trip a first-party GLB through the generic asset importer
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          gltf-transform validate .review/ci/portico/model.glb
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --output .review/ci/imported-portico
      - name: Restyle one imported material with portable procedural PBR
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --material-overrides examples/restyle-portico.json \
            --output .review/ci/restyled-portico
      - name: Generate verified first-party PBR texture-pack fixture
        run: python scripts/generate_first_party_texture_pack.py .review/ci/material-pack-fixture
      - name: Build a facade with external-file PBR maps embedded
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-facade --bays 3 \
            --texture-packs .review/ci/material-pack-fixture/facade.json \
            --output .review/ci/scanned-facade
      - name: Apply a verified PBR texture pack to an imported GLB
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --texture-packs .review/ci/material-pack-fixture/imported-portico.json \
            --output .review/ci/scanned-portico
      - name: Verify portable exports and required previews
        env:
          PYTHONPATH: src
        run: |
          python -m kumiki_blender audit --model .review/ci/lattice-tower/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/doric-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/facade/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/imported-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/restyled-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/scanned-facade/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/scanned-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit-revision --root .review/ci/lattice-tower
          python -m kumiki_blender audit-revision --root .review/ci/portico
          python -m kumiki_blender audit-revision --root .review/ci/doric-portico
          python -m kumiki_blender audit-revision --root .review/ci/facade
          python -m kumiki_blender audit-revision --root .review/ci/imported-portico
          python -m kumiki_blender audit-revision --root .review/ci/restyled-portico
          python -m kumiki_blender audit-revision --root .review/ci/scanned-facade
          python -m kumiki_blender audit-revision --root .review/ci/scanned-portico
          gltf-transform validate .review/ci/lattice-tower/model.glb
          gltf-transform validate .review/ci/portico/model.glb
          gltf-transform validate .review/ci/doric-portico/model.glb
          gltf-transform validate .review/ci/facade/model.glb
          gltf-transform validate .review/ci/imported-portico/model.glb
          gltf-transform validate .review/ci/restyled-portico/model.glb
          gltf-transform validate .review/ci/scanned-facade/model.glb
          gltf-transform validate .review/ci/scanned-portico/model.glb
          python -c 'import json; m=json.load(open(".review/ci/restyled-portico/manifest.json")); assert len(m["material_overrides"]) == 1 and m["material_overrides"][0]["preset"] == "natural-stone"'
          python -c 'import json; m=json.load(open(".review/ci/scanned-facade/manifest.json")); assert len(m["texture_packs"]) == 2 and all(v["pack"]["maps"]["normal"]["sha256"] for v in m["texture_packs"])'
          python -c 'import json; m=json.load(open(".review/ci/scanned-portico/manifest.json")); assert len(m["texture_packs"]) == 1 and m["texture_packs"][0]["target"] == "Architectural stone.004"'
          python -m unittest tests.test_export_audit tests.test_glb_audit -v
          test -s .review/ci/lattice-tower/previews/detail.png
          test -s .review/ci/portico/previews/detail.png
          test -s .review/ci/doric-portico/previews/detail.png
          test -s .review/ci/facade/previews/detail.png
          test -s .review/ci/imported-portico/previews/detail.png
          test -s .review/ci/restyled-portico/previews/detail.png
          test -s .review/ci/scanned-facade/previews/detail.png
          test -s .review/ci/scanned-portico/previews/detail.png
      - name: Preserve Blender crash diagnostics
        if: failure()
        run: |
          mkdir -p .review/ci/diagnostics
          for crash in /tmp/*.crash.txt; do
            if [ -f "$crash" ]; then
              cp "$crash" .review/ci/diagnostics/
            fi
          done
      - name: Upload Blender preview, source and GLB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-qa-${{ github.sha }}
          path: .review/ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
