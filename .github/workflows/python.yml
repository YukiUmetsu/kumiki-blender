name: Python foundation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  focused-tests:
    name: Khufu and Sphinx source geometry regressions (Python 3.11)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test measured Khufu masonry and Sphinx source intake
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_petrie_survey_has_203_measured_levels_and_observed_course_height_variation \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_khufu_petrie_preset_batches_real_course_heights_and_open_stone_joints \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_khufu_petrie_rejects_misleading_custom_parameters_or_unsurveyed_site_layout \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_sphinx_is_organic_and_has_independent_anatomy \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_rounded_lion_silhouette_and_head_are_not_cartoon_proportioned \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_sphinx_reference_has_four_distinct_toes_per_forepaw \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_face_relief_preserves_smooth_back_of_head \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_reference_face_proportions_and_carved_human_ears \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_sphinx_anatomical_face_has_sculpted_lids_nose_lips_and_chin \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_reference_nemes_wings_have_broad_swept_hem_and_closed_stone \
            tests.test_egyptian_monuments.EgyptianMonumentTests.test_nemes_forehead_has_physical_incised_folds \
            tests.test_rock_weathering.RockWeatheringTests.test_differential_bedding_and_mineral_pits_are_real_closed_relief \
            tests.test_rock_weathering.RockWeatheringTests.test_sphinx_has_rough_anatomical_surfaces_not_smooth_loft \
            tests.test_landmark_scan \
            tests.test_sphinx_scan_review \
            tests.test_sphinx_landmarks \
            tests.test_sphinx_sculpt \
            tests.test_cli.CLITests.test_sphinx_scan_build_preflights_rights_and_pairs_without_blender \
            tests.test_cli.CLITests.test_sphinx_scan_build_passes_prepared_record_to_blender
      - name: Compile Python sources
        run: python -m compileall -q src scripts

  tests:
    # Historical full-suite regression is intentionally opt-in; preserve all
    # test modules in the repo without rerunning proven coverage on every PR.
    if: github.event_name == 'workflow_dispatch'
    name: All retained Python tests (manual, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src scripts

  blender-smoke:
    name: Full historical Blender regression (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libegl1 libgl1
      - name: Cache official Blender archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64
      - name: Download and verify Blender 4.5.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz" \
              --output "$archive"
          fi
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" \
            --output "$RUNNER_TEMP/blender-4.5.15.sha256"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          grep -q "$checksum.*blender-4.5.15-linux-x64.tar.xz" "$RUNNER_TEMP/blender-4.5.15.sha256"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Inspect Blender runtime
        run: blender --version
      - name: Isolate stock Blender glTF exporter on one cube
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_gltf_probe.py
      - name: Render modular portico in reduced-cost QA mode
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-portico --bays 3 --output .review/ci/portico
      - name: Render Doric-style carved column variant
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-portico --bays 2 --order doric --output .review/ci/doric-portico
      - name: Render pointed masonry arcade with turned stone balustrades
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-portico --bays 2 --order tuscan --arch-style pointed --balustrade \
            --output .review/ci/pointed-balustrade-portico
      - name: Render Egyptian pyramid and sculpted Sphinx detail study
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind giza-study --pyramid-courses 18 \
            --output .review/ci/egyptian-monuments
      - name: Render historic Khufu course-height masonry study
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind pyramid --pyramid-preset khufu-petrie \
            --output .review/ci/khufu-petrie
      - name: Create a first-party Sphinx replacement GLB fixture
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_sphinx_scan_fixture.py
      - name: Render combined pyramid scene with imported Sphinx proxy
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind giza-study \
            --sphinx-source .review/ci/first-party-sphinx-proxy.glb \
            --sphinx-provenance examples/first-party-sphinx-scan.json \
            --output .review/ci/sphinx-scan-integration
      - name: Render reusable architectural facade detail kit
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-facade --bays 3 --output .review/ci/facade
      - name: Render lattice tower in reduced-cost QA mode
        if: always()
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build --recipe examples/lattice-observation-tower.json \
            --output .review/ci/lattice-tower
      - name: Set up Node for independent glTF specification validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned glTF-Transform validation CLI
        run: npm install --global @gltf-transform/cli@4.5.1
      - name: Round-trip a first-party GLB through the generic asset importer
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          gltf-transform validate .review/ci/portico/model.glb
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --output .review/ci/imported-portico
      - name: Restyle one imported material with portable procedural PBR
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --material-overrides examples/restyle-portico.json \
            --output .review/ci/restyled-portico
      - name: Generate verified first-party PBR texture-pack fixture
        run: python scripts/generate_first_party_texture_pack.py .review/ci/material-pack-fixture
      - name: Build a facade with external-file PBR maps embedded
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-facade --bays 3 \
            --texture-packs .review/ci/material-pack-fixture/facade.json \
            --output .review/ci/scanned-facade
      - name: Apply a verified PBR texture pack to an imported GLB
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            import-asset --input .review/ci/portico/model.glb \
            --provenance examples/first-party-import.json \
            --texture-packs .review/ci/material-pack-fixture/imported-portico.json \
            --output .review/ci/scanned-portico
      - name: Verify portable exports and required previews
        env:
          PYTHONPATH: src
        run: |
          python -m kumiki_blender audit --model .review/ci/lattice-tower/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/doric-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/pointed-balustrade-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/egyptian-monuments/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/khufu-petrie/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/sphinx-scan-integration/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/facade/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/imported-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/restyled-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/scanned-facade/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/scanned-portico/model.glb --require-pbr-textures
          python -m kumiki_blender audit-revision --root .review/ci/lattice-tower
          python -m kumiki_blender audit-revision --root .review/ci/portico
          python -m kumiki_blender audit-revision --root .review/ci/doric-portico
          python -m kumiki_blender audit-revision --root .review/ci/pointed-balustrade-portico
          python -m kumiki_blender audit-revision --root .review/ci/egyptian-monuments
          python -m kumiki_blender audit-revision --root .review/ci/khufu-petrie
          python -m kumiki_blender audit-revision --root .review/ci/sphinx-scan-integration
          python -m kumiki_blender audit-revision --root .review/ci/facade
          python -m kumiki_blender audit-revision --root .review/ci/imported-portico
          python -m kumiki_blender audit-revision --root .review/ci/restyled-portico
          python -m kumiki_blender audit-revision --root .review/ci/scanned-facade
          python -m kumiki_blender audit-revision --root .review/ci/scanned-portico
          gltf-transform validate .review/ci/lattice-tower/model.glb
          gltf-transform validate .review/ci/portico/model.glb
          gltf-transform validate .review/ci/doric-portico/model.glb
          gltf-transform validate .review/ci/pointed-balustrade-portico/model.glb
          gltf-transform validate .review/ci/egyptian-monuments/model.glb
          gltf-transform validate .review/ci/khufu-petrie/model.glb
          gltf-transform validate .review/ci/sphinx-scan-integration/model.glb
          gltf-transform validate .review/ci/facade/model.glb
          gltf-transform validate .review/ci/imported-portico/model.glb
          gltf-transform validate .review/ci/restyled-portico/model.glb
          gltf-transform validate .review/ci/scanned-facade/model.glb
          gltf-transform validate .review/ci/scanned-portico/model.glb
          python -c 'import json; m=json.load(open(".review/ci/restyled-portico/manifest.json")); assert len(m["material_overrides"]) == 1 and m["material_overrides"][0]["preset"] == "natural-stone"'
          python -c 'import json; m=json.load(open(".review/ci/scanned-facade/manifest.json")); assert len(m["texture_packs"]) == 2 and all(v["pack"]["maps"]["normal"]["sha256"] for v in m["texture_packs"])'
          python -c 'import json; m=json.load(open(".review/ci/scanned-portico/manifest.json")); assert len(m["texture_packs"]) == 1 and m["texture_packs"][0]["target"] == "Architectural stone.004"'
          python -c 'import json; m=json.load(open(".review/ci/sphinx-scan-integration/manifest.json")); assert m["sphinx_scan"]["mesh_objects"] == 4 and m["sphinx_scan"]["provenance"]["commercial_use_allowed"] and m["sphinx_sculpt_union"]["mode"] == "external-scan" and m["sphinx_scan"]["source_materials"] >= 1'
          python -c 'import json; m=json.load(open(".review/ci/khufu-petrie/manifest.json")); assert m["parameters"]["pyramid_courses"] == 201 and m["parameters"]["pyramid_preset"] == "khufu-petrie" and m["named_parts"]["pyramid_parts"] == 805'
          python -m unittest tests.test_export_audit tests.test_glb_audit -v
          test -s .review/ci/lattice-tower/previews/detail.png
          test -s .review/ci/portico/previews/detail.png
          test -s .review/ci/portico/previews/capital.png
          test -s .review/ci/doric-portico/previews/detail.png
          test -s .review/ci/doric-portico/previews/capital.png
          test -s .review/ci/pointed-balustrade-portico/previews/detail.png
          test -s .review/ci/pointed-balustrade-portico/previews/capital.png
          test -s .review/ci/egyptian-monuments/previews/masonry.png
          test -s .review/ci/khufu-petrie/previews/masonry.png
          test -s .review/ci/egyptian-monuments/previews/sphinx.png
          test -s .review/ci/egyptian-monuments/previews/sphinx-profile.png
          test -s .review/ci/egyptian-monuments/previews/sphinx-face.png
          test -s .review/ci/sphinx-scan-integration/previews/sphinx-face.png
          test -s .review/ci/facade/previews/detail.png
          test -s .review/ci/imported-portico/previews/detail.png
          test -s .review/ci/restyled-portico/previews/detail.png
          test -s .review/ci/scanned-facade/previews/detail.png
          test -s .review/ci/scanned-portico/previews/detail.png
      - name: Preserve Blender crash diagnostics
        if: failure()
        run: |
          mkdir -p .review/ci/diagnostics
          for crash in /tmp/*.crash.txt; do
            if [ -f "$crash" ]; then
              cp "$crash" .review/ci/diagnostics/
            fi
          done
      - name: Upload Blender preview, source and GLB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-qa-${{ github.sha }}
          path: .review/ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  blender-focused:
    name: Khufu pyramid, procedural Sphinx and sourced-Sphinx Blender QA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required Blender system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libegl1 libgl1
      - name: Cache Blender 4.5 LTS
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64
      - name: Download and verify Blender 4.5.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz" \
              --output "$archive"
          fi
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" \
            --output "$RUNNER_TEMP/blender-4.5.15.sha256"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          grep -q "$checksum.*blender-4.5.15-linux-x64.tar.xz" "$RUNNER_TEMP/blender-4.5.15.sha256"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Render measured Khufu course-height pyramid
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind pyramid --pyramid-preset khufu-petrie \
            --output .review/ci/khufu-petrie
      - name: Render newly sculpted procedural Sphinx and anatomical views
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind sphinx \
            --output .review/ci/sphinx-procedural
      - name: Create first-party Sphinx scan integration fixture
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_sphinx_scan_fixture.py
      - name: Render-only Sphinx source review without exporting source geometry
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            review-sphinx-source \
            --input .review/ci/first-party-sphinx-proxy.glb \
            --front-axis=-X \
            --output .review/ci/sphinx-source-review
      - name: Render Sphinx external geometry intake and anatomical views
        env:
          KUMIKI_RENDER_PROFILE: smoke
        run: |
          blender --background --factory-startup --threads 1 --python-exit-code 1 \
            --python scripts/blender_entry.py -- \
            build-monument --kind sphinx \
            --sphinx-source .review/ci/first-party-sphinx-proxy.glb \
            --sphinx-provenance examples/first-party-sphinx-scan.json \
            --output .review/ci/sphinx-scan-integration
      - name: Audit Khufu export, Sphinx sculpt union and previews
        env:
          PYTHONPATH: src
        run: |
          python -m kumiki_blender audit-revision --root .review/ci/khufu-petrie
          python -m kumiki_blender audit-revision --root .review/ci/sphinx-procedural
          python -m kumiki_blender audit-revision --root .review/ci/sphinx-scan-integration
          python -m kumiki_blender audit --model .review/ci/khufu-petrie/model.glb --require-pbr-textures
          python -m kumiki_blender audit --model .review/ci/sphinx-procedural/model.glb --require-pbr-textures
          # The deliberately small first-party Sphinx proxy has no PBR maps;
          # preserve a static-mesh/attribution gate without treating it as a
          # production-quality scan.
          python -m kumiki_blender audit --model .review/ci/sphinx-scan-integration/model.glb
          python -c 'import json; m=json.load(open(".review/ci/khufu-petrie/manifest.json")); assert m["parameters"]["pyramid_courses"] == 201 and m["named_parts"]["pyramid_parts"] == 805'
          python -c 'import json; m=json.load(open(".review/ci/sphinx-procedural/manifest.json")); assert m["sphinx_sculpt_union"]["body"]["sources"] == 8 and m["sphinx_sculpt_union"]["head"]["sources"] == 6 and m["named_parts"]["sphinx_parts"] == 23'
          python -c 'import json; m=json.load(open(".review/ci/sphinx-scan-integration/manifest.json")); s=m["sphinx_scan"]; assert s["provenance"]["commercial_use_allowed"] and s["mesh_objects"] >= 1 and "passes_bounding_envelope_screen" in s["source_geometry_review"] and not s["source_readiness_review"]["technical_screen_passed"] and not s["source_readiness_review"]["monument_source_authenticated"]'
          test -s .review/ci/khufu-petrie/previews/masonry.png
          test -s .review/ci/sphinx-procedural/previews/sphinx.png
          test -s .review/ci/sphinx-procedural/previews/sphinx-profile.png
          test -s .review/ci/sphinx-procedural/previews/sphinx-face.png
          test -s .review/ci/sphinx-procedural/previews/sphinx-frontal.png
          test -s .review/ci/sphinx-scan-integration/previews/sphinx.png
          test -s .review/ci/sphinx-scan-integration/previews/sphinx-profile.png
          test -s .review/ci/sphinx-scan-integration/previews/sphinx-face.png
          test -s .review/ci/sphinx-scan-integration/previews/sphinx-frontal.png
          test -s .review/ci/sphinx-source-review/frontal.png
          test -s .review/ci/sphinx-source-review/face-three-quarter.png
          test -s .review/ci/sphinx-source-review/side-profile.png
          test -s .review/ci/sphinx-source-review/review.json
          python -c 'import json; m=json.load(open(".review/ci/sphinx-source-review/review.json")); assert m["no_source_geometry_exported"] and m["no_source_textures_exported"] and m["mesh_objects"] == 4 and len(m["previews"]) == 4'
      - name: Upload focused Blender previews and source artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-qa-${{ github.sha }}
          path: .review/ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

  visual-qa:
    name: Extract actual Blender renders for visual QA
    if: github.event_name == 'pull_request'
    needs: blender-focused
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blender-qa-${{ github.sha }}
          path: .review/ci/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview-only JPEG encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Publish small image QA thumbnails in job log
        run: |
          python scripts/emit_qa_jpegs.py \
            .review/ci/khufu-petrie/preview.png \
            .review/ci/khufu-petrie/previews/masonry.png \
            .review/ci/sphinx-procedural/previews/sphinx.png \
            .review/ci/sphinx-procedural/previews/sphinx-profile.png \
            .review/ci/sphinx-procedural/previews/sphinx-face.png \
            .review/ci/sphinx-procedural/previews/sphinx-frontal.png \
            .review/ci/sphinx-scan-integration/previews/sphinx.png \
            .review/ci/sphinx-scan-integration/previews/sphinx-profile.png \
            .review/ci/sphinx-scan-integration/previews/sphinx-face.png \
            .review/ci/sphinx-scan-integration/previews/sphinx-frontal.png
