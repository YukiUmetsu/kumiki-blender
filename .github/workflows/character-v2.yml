name: Character v2 focused unit tests

on:
  pull_request:
    paths:
      - "src/kumiki_blender/character_build/**"
      - "tests/test_character_spec_v2.py"
      - "tests/test_character_region_sculpt_plan.py"
      - "tests/test_character_pose_spec.py"
      - "tests/test_character_rig_controls.py"
      - "tests/test_character_topology_zones.py"
      - "tests/test_character_animation_bake_plan.py"
      - "tests/test_character_glb_animation.py"
      - "tests/test_character_viseme_plan.py"
      - "tests/test_character_performance_plan.py"
      - "tests/test_character_glb_performance.py"
      - "tests/test_character_talking_plan.py"
      - "tests/test_character_landmark_triangulation.py"
      - "tests/test_character_conflict_repair.py"
      - "tests/test_character_penetration_repair.py"
      - "tests/test_character_semantic_regions.py"
      - "scripts/smoke_character_penetration_repair_blender.py"
      - "scripts/smoke_character_anatomy_blender.py"
      - "scripts/smoke_character_joint_refine_blender.py"
      - "scripts/smoke_character_geodesic_fit_blender.py"
      - "tests/test_character_anatomy.py"
      - "tests/test_character_anatomy_landmark_resolver.py"
      - "tests/test_character_joint_refine_plan.py"
      - "tests/test_character_geodesic_fit.py"
      - "tests/test_character_region_revision_gate.py"
      - "tests/test_character_fit_source_qa.py"
      - "tests/test_character_source_contours.py"
      - ".github/workflows/character-v2.yml"
  workflow_dispatch:

# Cancel redundant queued/running PR checks when a newer commit arrives.
# Prevents repeated Blender 4.5 downloads and reduces CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  character-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install character build dependencies
        run: python -m pip install -e '.[character-build]' 'pytest>=8,<10'
      - name: Test CharacterSpec v2, region comparison and safe sculpt/pose contracts
        run: |
          PYTHONPATH=src:tests python -m unittest -q \
            tests.test_character_spec_v2 \
            tests.test_character_region_sculpt_plan \
            tests.test_character_pose_spec \
            tests.test_character_rig_controls \
            tests.test_character_topology_zones \
            tests.test_character_animation_bake_plan \
            tests.test_character_glb_animation \
            tests.test_character_viseme_plan \
            tests.test_character_performance_plan \
            tests.test_character_glb_performance \
            tests.test_character_talking_plan \
            tests.test_character_landmark_triangulation \
            tests.test_character_anatomy \
            tests.test_character_anatomy_landmark_resolver \
            tests.test_character_joint_refine_plan \
            tests.test_character_geodesic_fit \
            tests.test_character_region_revision_gate \
            tests.test_character_fit_source_qa \
            tests.test_character_source_contours


      - name: Test opt-in semantic conflict repair and regression safety
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_character_conflict_repair.py tests/test_character_penetration_repair.py tests/test_character_semantic_regions.py

  character-blender-smoke:
    name: Native Blender character worker smoke
    needs: character-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libegl1 libgl1
      - name: Cache official Blender 4.5 LTS archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64
      - name: Verify and unpack Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          digest_file="$RUNNER_TEMP/blender-4.5.15.sha256"
          official="https://download.blender.org/release/Blender4.5"
          foundation_mirror="https://mirror.blender.org/release/Blender4.5"
          # GitHub-hosted runners occasionally receive HTTP 403 from the
          # legacy download host. The fallback is Blender Foundation's
          # own official mirror (advertised at blender.org/download).
          download_checked() {
            local url="$1" dest="$2"
            rm -f "$dest.partial"
            if curl --fail --location --retry 2 --connect-timeout 20 \
              --max-time 600 --output "$dest.partial" "$url"; then
              mv "$dest.partial" "$dest"
              return 0
            fi
            rm -f "$dest.partial"
            return 1
          }
          if [ ! -f "$archive" ]; then
            download_checked "$official/blender-4.5.15-linux-x64.tar.xz" "$archive" ||
              download_checked "$foundation_mirror/blender-4.5.15-linux-x64.tar.xz" "$archive" ||
              { echo "::error::Blender Foundation official download and mirror are unavailable"; exit 1; }
          fi
          download_checked "$official/blender-4.5.15.sha256" "$digest_file" ||
            download_checked "$foundation_mirror/blender-4.5.15.sha256" "$digest_file" ||
            { echo "::error::Blender Foundation checksum manifest unavailable"; exit 1; }
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          grep -q "$checksum.*blender-4.5.15-linux-x64.tar.xz" "$RUNNER_TEMP/blender-4.5.15.sha256"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Smoke-test isolated region sculpt, topology, rig controls and pose QA
        env:
          PYTHONPATH: src:tests
        run: |
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_controls_topology_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_visemes_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_performance_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_anatomy_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_joint_refine_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_geodesic_fit_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_penetration_repair_blender.py
