name: Character v2 focused unit tests

on:
  pull_request:
    paths:
      - "src/kumiki_blender/character_build/**"
      - "tests/test_character_spec_v2.py"
      - "tests/test_character_region_sculpt_plan.py"
      - "tests/test_character_pose_spec.py"
      - "tests/test_character_rig_controls.py"
      - "tests/test_character_topology_zones.py"
      - "tests/test_character_animation_bake_plan.py"
      - "tests/test_character_glb_animation.py"
      - "tests/test_character_viseme_plan.py"
      - "tests/test_character_performance_plan.py"
      - "tests/test_character_glb_performance.py"
      - "tests/test_character_talking_plan.py"
      - "tests/test_character_conflict_repair.py"
      - "tests/test_character_penetration_repair.py"
      - "scripts/smoke_character_penetration_repair_blender.py"
      - ".github/workflows/character-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install character build dependencies
        run: python -m pip install -e '.[character-build]' 'pytest>=8,<10'
      - name: Test CharacterSpec v2, region comparison and safe sculpt/pose contracts
        run: |
          PYTHONPATH=src:tests python -m unittest -q \
            tests.test_character_spec_v2 \
            tests.test_character_region_sculpt_plan \
            tests.test_character_pose_spec \
            tests.test_character_rig_controls \
            tests.test_character_topology_zones \
            tests.test_character_animation_bake_plan \
            tests.test_character_glb_animation \
            tests.test_character_viseme_plan \
            tests.test_character_performance_plan \
            tests.test_character_glb_performance \
            tests.test_character_talking_plan
      - name: Test opt-in semantic conflict repair and regression safety
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_character_conflict_repair.py tests/test_character_penetration_repair.py


  character-blender-smoke:
    name: Native Blender character worker smoke
    needs: character-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libegl1 libgl1
      - name: Cache official Blender 4.5 LTS archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-4.5.15-linux-x64.tar.xz
          key: blender-4.5.15-linux-x64
      - name: Verify and unpack Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 \
              "https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz" \
              --output "$archive"
          fi
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256" \
            --output "$RUNNER_TEMP/blender-4.5.15.sha256"
          checksum="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          grep -q "$checksum.*blender-4.5.15-linux-x64.tar.xz" "$RUNNER_TEMP/blender-4.5.15.sha256"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$archive" -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Smoke-test isolated region sculpt, topology, rig controls and pose QA
        env:
          PYTHONPATH: src:tests
        run: |
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_controls_topology_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_visemes_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_performance_blender.py
          blender --background --factory-startup --threads 2 \
            --python-exit-code 1 \
            --python scripts/smoke_character_penetration_repair_blender.py
